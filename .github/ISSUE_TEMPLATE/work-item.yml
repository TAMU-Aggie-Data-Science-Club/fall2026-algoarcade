name: Work item
description: One person, about one week, with a checkable definition of done.
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: The role or person who will do it.
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due
      description: A Sunday. Use the matching milestone as well.
      placeholder: "2026-11-01"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Two to four sentences. Why this exists and what waits on it.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What exists when this is done. Paths, commands, numbers.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Four to seven checks that someone other than the author can run. A command and its result, a named test, a number with a threshold, or an artifact at a path.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: The doc section that defines the contract, known traps, and what is out of scope.
